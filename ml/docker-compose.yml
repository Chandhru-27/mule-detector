
services:
  ml-pipeline:
    build: .
    container_name: ml-pipeline
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=transactions.raw
    ports:
      - "5000:5000"
    networks:
      - mule-detector-net

networks:
  mule-detector-net:
