[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "mule-detector-backend"
version = "0.1.0"
description = "Data streaming and API services for mule detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "confluent-kafka>=2.13.2",
    "fastapi>=0.135.1",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.1",
    "redis>=7.4.0",
    "rich>=14.3.3",
    "ruff>=0.15.7",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "hatching>=0.0.1",
]
